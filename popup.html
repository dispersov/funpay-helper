<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; width: 270px; margin: 0; padding: 14px; color: var(--fph-text, #e6e7ea); background: var(--fph-page-solid, #121316); }
    h3 { margin: 0 0 12px; font-size: 16px; }
    label { display: block; color: var(--fph-muted, #8b9099); margin-bottom: 6px; }
    select { width: 100%; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--fph-border, #2c2f35); background: var(--fph-input, #1b1d21); color: inherit; font: inherit; }
    a { display: block; padding: 8px 10px; margin: 4px 0; border-radius: 8px; color: inherit; text-decoration: none; cursor: pointer; background: var(--fph-surface-2, #ffffff10); }
    a:hover { background: var(--fph-surface-3, #ffffff1c); }
    hr { border: none; border-top: 1px solid var(--fph-border, #2c2f35); margin: 12px 0; }
  </style>
</head>
<body>
  <h3>FunPay Helper</h3>
  <label for="preset">Тема</label>
  <select id="preset"></select>
  <hr>
  <a data-url="https://funpay.com/orders/trade?fph=stats">📊 Статистика продаж</a>
  <a data-url="https://funpay.com/orders/trade">🧾 Мои продажи</a>
  <a data-url="https://funpay.com/#helper">⚙️ Все настройки</a>
  <script src="theme-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
